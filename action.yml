name: "generate-multi-source-snake-animation"
description: "Generate a multi-source GitHub, Gitee, and GitCode commit snake"
author: "ZQ"

runs:
  using: docker
  image: Dockerfile

inputs:
  GITHUB_USER:
    description: "GitHub user name"
    required: true
  GITHUB_TOKEN:
    description: "GitHub GraphQL token; use a token with read:user to include private contribution counts."
    required: true
  GITEE_USER:
    description: "Gitee user name"
    required: false
  GITEE_TOKEN:
    description: "Gitee token used to access Gitee API."
    required: false
  GITCODE_USER:
    description: "GitCode user name"
    required: false
  GITCODE_TOKEN:
    description: "GitCode personal access token"
    required: false
  WINDOW_DAYS:
    description: "Number of recent UTC days to display (1-366)"
    required: false
    default: "365"
  outputs:
    required: true
    description: |
      list of files to generate.
      one file per line. Each output can be customized with options as query string.

       supported query string options:

      - palette:      A preset of color, one of [github, github-dark, github-light]
      - color_snake:  Color of the snake
      - color_dots:   Coma separated list of dots color. 
                      The first one is 0 contribution, then it goes from the low contribution to the highest.
                      Exactly 5 colors are expected.
      example:
        outputs: |
          dark.svg?palette=github-dark&color_snake=blue
          light.svg?color_snake=#7845ab
          ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
